<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dashboard</title>
  <link
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  />-->
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-primary: #F3E2CE;
      --bg-secondary: #A8D5BA;
      --card-bg: #fff9f6e6;
      --card-border: #e5d3b3;
      --text-primary: #1E3309;
      --text-secondary: #B03060;
      --accent-primary: #E23260;
      --accent-secondary: #FF6F61;
      --accent-gradient: linear-gradient(135deg, #E23260 0%, #F2678E 100%);
      --success: #849A28;
      --warning: #FCA9AA;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-soft: 0 2px 8px #B0306010;
      --shadow-medium: 0 4px 16px #1E330920;
      --blur: backdrop-filter: blur(12px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: url('3a5cbf7b7096fbf4ac6e137676a6471d.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .dashboard-header {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 2rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .dashboard-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-gradient);
      opacity: 0.1;
      z-index: -1;
    }
    .dashboard-header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .dashboard-header i {
      font-size: 2rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.2rem 1rem;
      min-height: 220px;
      box-shadow: var(--shadow-soft);
      transition: box-shadow 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      box-shadow: var(--shadow-medium);
      transform: translateY(-2px) scale(1.01);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-gradient);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .card-header {
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }
    .card-title {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-primary);
    }
    .card-content {
      flex: 1;
      font-size: 0.98rem;
      padding-top: 0.2rem;
      overflow: auto;
    }

    /* Specific card tweaks */
    .weather-card {
      background: linear-gradient(135deg, rgba(168, 213, 186, 0.25) 0%, rgba(243, 226, 206, 0.25) 100%);
    }
    .calendar-card {
      background: linear-gradient(135deg, rgba(132, 154, 40, 0.2) 0%, rgba(30, 51, 9, 0.2) 100%);
    }
    .tasks-card {
      background: linear-gradient(135deg, rgba(252, 169, 170, 0.25) 0%, rgba(255, 111, 97, 0.25) 100%);
      grid-column: 1 / span 2;
    }
    .chatgpt-card {
      background: linear-gradient(135deg, rgba(226, 50, 96, 0.2) 0%, rgba(176, 48, 96, 0.2) 100%);
      grid-column: 1 / span 2;
      min-height: 200px;
    }

    .weather-info {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .weather-temp {
      font-size: 2.1rem;
      font-weight: 600;
      color: var(--success);
    }
    .weather-location {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .weather-description {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .calendar-date {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .calendar-day {
      display: block;
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--accent-primary);
    }
    .calendar-month {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .event-item + .event-item {
      margin-top: 0.75rem;
    }
    .event-time {
      font-size: 0.85rem;
      color: var(--accent-secondary);
      font-weight: 500;
    }
    .event-title {
      margin-top: 0.25rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .chat-input-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .chat-input {
      flex: 1;
      padding: 1rem 1.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      color: var(--text-primary);
    }
    .chat-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .chat-input::placeholder {
      color: var(--text-secondary);
    }
    .chat-submit {
      padding: 1rem 1.5rem;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.2s;
    }
    .chat-submit:hover {
      transform: translateY(-2px);
    }
    .chat-response {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 1.5rem;
      min-height: 120px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .tasks-list table {
      width: max-content;
      min-width: 600px;
      border-collapse: collapse;
    }
    .tasks-list th,
    .tasks-list td {
      padding: 4px 8px;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }
    .tasks-list th {
      background: rgba(255,255,255,0.9);
      color: var(--accent-primary);
      font-weight: 600;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 0.5rem;
    }
    .status-online {
      background: var(--success);
      box-shadow: 0 0 8px rgba(132,154,40,0.4);
    }
    .status-warning {
      background: var(--warning);
      box-shadow: 0 0 8px rgba(252,169,170,0.4);
    }

    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .tasks-card { grid-column: auto; }
    }
    @media (max-width: 768px) {
      .dashboard-container { padding: 1rem; }
      .dashboard-header h1 { font-size: 2rem; }
      .weather-temp { font-size: 2.5rem; }
      .calendar-day { font-size: 2rem; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card {
      animation: fadeInUp 0.6s ease forwards;
    }
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <h1><i class="fa-solid fa-house"></i>dashboard</h1>
  </header>

  <div class="dashboard-container">
    <div class="dashboard-grid">
      <!-- Weather Card -->
      <section class="card weather-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-cloud-sun"></i>
            Weather
            <span class="status-indicator status-online"></span>
          </h2>
        </div>
        <div class="card-content">
          <div class="weather-info">
            <div class="weather-temp">72°</div>
            <div>
              <div class="weather-location">Aurora, CO</div>
              <div class="weather-description">Partly cloudy • Updated just now</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Calendar Card -->
      <section class="card calendar-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-calendar-days"></i>
            Today
          </h2>
        </div>
        <div class="card-content">
          <div class="calendar-date">
            <span class="calendar-day"></span>
            <span class="calendar-month"></span>
          </div>
          <div class="calendar-events">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>

      <!-- ChatGPT Card -->
      <section class="card chatgpt-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-robot"></i>
            AI Assistant
            <span class="status-indicator status-online"></span>
          </h2>
        </div>
        <div class="card-content">
          <div class="chat-input-container">
            <input
              id="chatInput"
              class="chat-input"
              type="text"
              placeholder="Ask me anything..."
            />
            <button id="chatSubmit" class="chat-submit">
              <i class="fa-solid fa-paper-plane"></i> Send
            </button>
          </div>
          <div id="chatResponse" class="chat-response">
            Ready to help! Ask me about weather, schedule management, task planning, or anything else you need assistance with.
          </div>
        </div>
      </section>

      <!-- Tasks Card -->
      <section class="card tasks-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-list-check"></i>
            Tasks
            <span class="status-indicator status-warning"></span>
          </h2>
        </div>
        <div class="card-content" style="overflow:auto; max-height:320px;">
          <div id="notion-tasks" class="tasks-list">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

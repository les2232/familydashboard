<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dashboard</title>
  <link
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  />
  <link rel="stylesheet" href="critical.css">
  <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
  <header class="dashboard-header">
    <h1><i class="fa-solid fa-house"></i>dashboard</h1>
  </header>

  <div class="dashboard-container">
    <div class="dashboard-grid">
      <!-- Weather Card -->
      <section class="card weather-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-cloud-sun"></i>
            Weather
            <span class="status-indicator status-online"></span>
          </h2>
        </div>
        <div class="card-content">
          <div class="weather-info">
            <div class="weather-temp">72°</div>
            <div>
              <div class="weather-location">Aurora, CO</div>
              <div class="weather-description">Partly cloudy • Updated just now</div>
            </div>
          </div>
          <div class="weather-week"></div>
        </div>
      </section>

      <!-- Calendar Card -->
      <section class="card calendar-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-calendar-days"></i>
            Today
            <span class="status-indicator status-online"></span>
          </h2>
        </div>
        <div class="card-content">
          <div class="calendar-date">
            <span class="calendar-day"></span>
            <span class="calendar-month"></span>
          </div>
          <div class="calendar-events">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>

      <!-- ChatGPT Card -->
      <section class="card chatgpt-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-robot"></i>
            AI Assistant
            <span class="status-indicator status-online"></span>
          </h2>
        </div>
        <div class="card-content">
          <div class="chat-input-container">
            <input
              id="chatInput"
              class="chat-input"
              type="text"
              placeholder="Ask me anything..."
            />
            <button id="chatSubmit" class="chat-submit">
              <i class="fa-solid fa-paper-plane"></i> Send
            </button>
          </div>
          <div id="chatResponse" class="chat-response">
            Ready to help! Ask me about weather, schedule management, task planning, or anything else you need assistance with.
          </div>
        </div>
      </section>

      <!-- Tasks Card -->
      <section class="card tasks-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-list-check"></i>
            Tasks
            <span class="status-indicator status-warning"></span>
          </h2>
        </div>
        <div class="card-content" style="overflow:auto; max-height:320px;">
          <div id="notion-tasks" class="tasks-list">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
